apiVersion: batch/v1
kind: Job
metadata:
  name: myjob
spec:
  completions: 2
  template:
    metadata:
      name: myjob
    spec:
      containers:
      - name: myjob
        image: ubuntu:latest
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "Hello job"
          sleep 5
          echo "complete job"
          exit 1
      restartPolicy: Never
